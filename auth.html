<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Uni Pilot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --green: #0b5d3b;
      --dark-green: #063b26;
      --light-green: #eaf6ef;
      --yellow: #f5c518;
      --white: #ffffff;
      --background: #f7faf8;
      --text: #17221c;
      --muted: #6d7a72;
      --border: #dfe8e2;
      --danger: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Manrope", sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      width: min(1200px, 92%);
      margin: auto;
      min-height: 75px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      text-decoration: none;
      color: var(--dark-green);

      display: flex;
      align-items: center;
      gap: 9px;

      font-size: 1.2rem;
      font-weight: 800;
    }

    .brand-icon {
      font-size: 1.5rem;
    }

    .back-home {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .back-home:hover {
      text-decoration: underline;
    }

    /* =========================
       MAIN
    ========================== */

    main {
      flex: 1;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 50px 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 460px;
    }

    .auth-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;

      padding: 38px;

      box-shadow: 0 12px 35px rgba(6, 59, 38, 0.08);
    }

    .auth-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo {
      width: 62px;
      height: 62px;

      margin: 0 auto 18px;

      border-radius: 18px;
      background: var(--light-green);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 1.8rem;
    }

    .auth-heading h1 {
      font-size: 1.65rem;
      margin-bottom: 8px;
    }

    .auth-heading p {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    /* =========================
       TABS
    ========================== */

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;

      background: var(--light-green);
      border-radius: 10px;

      padding: 4px;
      margin-bottom: 25px;
    }

    .auth-tab {
      border: none;
      background: transparent;

      padding: 11px;

      border-radius: 7px;

      font-family: inherit;
      font-weight: 700;
      color: var(--muted);

      cursor: pointer;
    }

    .auth-tab.active {
      background: var(--white);
      color: var(--green);

      box-shadow: 0 2px 8px rgba(6, 59, 38, 0.08);
    }

    /* =========================
       FORMS
    ========================== */

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;

      margin-bottom: 7px;

      font-size: 0.88rem;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid var(--border);
      border-radius: 9px;

      outline: none;

      font-family: inherit;
      font-size: 0.92rem;

      background: var(--white);
      color: var(--text);
    }

    .form-group input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(11, 93, 59, 0.08);
    }

    .password-note {
      margin-top: 6px;

      color: var(--muted);
      font-size: 0.75rem;
    }

    .submit-btn {
      width: 100%;

      border: none;
      border-radius: 9px;

      padding: 13px;

      background: var(--green);
      color: var(--white);

      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .submit-btn:hover {
      background: var(--dark-green);
      transform: translateY(-1px);
    }

    /* =========================
       MESSAGE
    ========================== */

    .message {
      display: none;

      margin-bottom: 18px;

      padding: 11px 13px;

      border-radius: 8px;

      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fdecec;
      color: var(--danger);
    }

    .message.success {
      background: var(--light-green);
      color: var(--green);
    }

    /* =========================
       FOOTER
    ========================== */

    .auth-footer {
      text-align: center;

      margin-top: 22px;

      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .auth-footer a {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 520px) {

      .navbar {
        min-height: 68px;
      }

      .auth-card {
        padding: 28px 20px;
        border-radius: 16px;
      }

      main {
        padding: 30px 15px;
      }

      .auth-heading h1 {
        font-size: 1.45rem;
      }

      .back-home {
        font-size: 0.8rem;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <nav class="navbar">

      <a href="index.html" class="brand">
        <span class="brand-icon">🎓</span>
        <span>Uni Pilot</span>
      </a>

      <a href="index.html" class="back-home">
        ← Back Home
      </a>

    </nav>

  </header>


  <!-- =========================
       AUTH
  ========================== -->

  <main>

    <div class="auth-container">

      <div class="auth-card">

        <div class="auth-heading">

          <div class="auth-logo">
            🎓
          </div>

          <h1 id="authTitle">
            Welcome Back
          </h1>

          <p id="authSubtitle">
            Log in to your Uni Pilot account.
          </p>

        </div>


        <!-- TABS -->

        <div class="auth-tabs">

          <button
            type="button"
            class="auth-tab active"
            id="loginTab"
          >
            Login
          </button>

          <button
            type="button"
            class="auth-tab"
            id="signupTab"
          >
            Sign Up
          </button>

        </div>


        <!-- MESSAGE -->

        <div class="message" id="message"></div>


        <!-- =========================
             LOGIN FORM
        ========================== -->

        <form id="loginForm" class="auth-form active">

          <div class="form-group">

            <label for="loginEmail">
              Email
            </label>

            <input
              type="email"
              id="loginEmail"
              placeholder="Enter your email"
              required
            >

          </div>


          <div class="form-group">

            <label for="loginPassword">
              Password
            </label>

            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
              required
            >

          </div>


          <button type="submit" class="submit-btn">
            Login
          </button>

        </form>


        <!-- =========================
             SIGN UP FORM
        ========================== -->

        <form id="signupForm" class="auth-form">

          <div class="form-group">

            <label for="signupName">
              Full Name
            </label>

            <input
              type="text"
              id="signupName"
              placeholder="Enter your full name"
              required
            >

          </div>


          <div class="form-group">

            <label for="signupEmail">
              Email
            </label>

            <input
              type="email"
              id="signupEmail"
              placeholder="Enter your email"
              required
            >

          </div>


          <div class="form-group">

            <label for="signupPassword">
              Password
            </label>

            <input
              type="password"
              id="signupPassword"
              placeholder="Create a password"
              minlength="6"
              required
            >

            <p class="password-note">
              Password must be at least 6 characters.
            </p>

          </div>


          <button type="submit" class="submit-btn">
            Create Account
          </button>

        </form>


        <div class="auth-footer">

          <p>
            By continuing, you agree to use Uni Pilot responsibly.
          </p>

        </div>

      </div>

    </div>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");

    const message = document.getElementById("message");


    /* =========================
       SWITCH AUTH MODE
    ========================== */

    function showLogin() {

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

      loginForm.classList.add("active");
      signupForm.classList.remove("active");

      authTitle.textContent = "Welcome Back";
      authSubtitle.textContent = "Log in to your Uni Pilot account.";

      clearMessage();
    }


    function showSignup() {

      signupTab.classList.add("active");
      loginTab.classList.remove("active");

      signupForm.classList.add("active");
      loginForm.classList.remove("active");

      authTitle.textContent = "Create Account";
      authSubtitle.textContent = "Join Uni Pilot and get more from your student experience.";

      clearMessage();
    }


    loginTab.addEventListener("click", showLogin);

    signupTab.addEventListener("click", showSignup);


    /* =========================
       MESSAGE
    ========================== */

    function showMessage(text, type) {

      message.textContent = text;

      message.className = "message show " + type;
    }


    function clearMessage() {

      message.textContent = "";
      message.className = "message";

    }


    /* =========================
       SIGN UP
    ========================== */

    signupForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim().toLowerCase();
      const password = document.getElementById("signupPassword").value;


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      const existingUser = localStorage.getItem("uniPilotUser");

      if (existingUser) {

        const user = JSON.parse(existingUser);

        if (user.email === email) {

          showMessage(
            "An account with this email already exists. Please log in.",
            "error"
          );

          return;
        }

      }


      const user = {
        name: name,
        email: email,
        password: password
      };


      localStorage.setItem(
        "uniPilotUser",
        JSON.stringify(user)
      );


      showMessage(
        "Account created successfully! You can now log in.",
        "success"
      );


      signupForm.reset();


      setTimeout(function() {
        showLogin();

        document.getElementById("loginEmail").value = email;
      }, 1200);

    });


    /* =========================
       LOGIN
    ========================== */

    loginForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;


      const savedUser = localStorage.getItem("uniPilotUser");


      if (!savedUser) {

        showMessage(
          "No account found. Please sign up first.",
          "error"
        );

        return;
      }


      const user = JSON.parse(savedUser);


      if (
        user.email === email &&
        user.password === password
      ) {

        localStorage.setItem(
          "uniPilotLoggedIn",
          "true"
        );


        localStorage.setItem(
          "uniPilotCurrentUser",
          JSON.stringify({
            name: user.name,
            email: user.email
          })
        );


        showMessage(
          "Login successful! Welcome back, " + user.name + ".",
          "success"
        );


        setTimeout(function() {
          window.location.href = "index.html";
        }, 1000);


      } else {

        showMessage(
          "Incorrect email or password. Please try again.",
          "error"
        );

      }

    });

  </script>

</body>
</html>
