 <!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>AAUA UNI PILOT</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } body { background: linear-gradient(135deg, #0f172a, #1e3a8a, #3b82f6); height: 100vh; overflow: hidden; color: #ffffff; display: flex; justify-content: center; align-items: center; } /* Container for the whole sequence */ .stage { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; } /* --- STEP 1: WELCOME SCREEN --- */ .welcome-container { position: absolute; display: flex; align-items: center; gap: 20px; animation: slideInLeft 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; } .cap-icon { font-size: 5rem; /* Cap is bigger than the text */ filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); } .text-group { display: flex; flex-direction: column; } .welcome-tag { font-size: 1.2rem; letter-spacing: 3px; color: #93c5fd; font-weight: 600; } .brand-title { font-size: 3rem; font-weight: 800; letter-spacing: 1px; background: linear-gradient(to right, #ffffff, #bfdbfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } /* --- STEP 2 & 3: START NAVIGATING & LOGIN --- */ .navigating-container { position: absolute; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: scale(0.9); pointer-events: none; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); } .navigating-title { font-size: 3.5rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 25px; text-transform: uppercase; text-shadow: 0 4px 20px rgba(0,0,0,0.4); text-align: center; } .login-btn { padding: 14px 40px; font-size: 1.1rem; font-weight: 700; color: #1e3a8a; background: #ffffff; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease; } .login-btn:hover { transform: translateY(-3px); background: #bfdbfe; box-shadow: 0 15px 30px rgba(0,0,0,0.4); } /* --- LOGIN MODAL / CARD --- */ .login-modal { position: absolute; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); opacity: 0; transform: translateY(30px); pointer-events: none; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); } .login-modal h2 { margin-bottom: 25px; font-size: 1.8rem; text-align: center; color: #ffffff; } .input-group { margin-bottom: 20px; } .input-group label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: #cbd5e1; } .input-group input { width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.3s; } .input-group input:focus { border-color: #3b82f6; } .submit-btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; } .submit-btn:hover { background: #1d4ed8; } /* --- ANIMATION CLASSES TRIGGERED BY JS --- */ .fade-out { opacity: 0; transform: scale(1.1); transition: opacity 0.6s ease, transform 0.6s ease; pointer-events: none; } .fade-in { opacity: 1; transform: scale(1); pointer-events: auto; } @keyframes slideInLeft { 0% { opacity: 0; transform: translateX(-100px); } 100% { opacity: 1; transform: translateX(0); } } </style>   <link rel="stylesheet" href="site-navigation.css">
</head> <body> <div class="stage"> <!-- STEP 1: Welcome & Branding --> <div class="welcome-container" id="welcomeScreen"> <div class="cap-icon">🎓</div> <div class="text-group"> <span class="welcome-tag">WELCOME TO</span> <span class="brand-title">AAUA UNI PILOT</span> </div> </div> <!-- STEP 2: Start Navigating --> <div class="navigating-container" id="navigatingScreen"> <div class="navigating-title">START NAVIGATING</div> <button class="login-btn" id="openLoginBtn">LOGIN / SIGNIN</button> </div> <!-- STEP 3: Actual Login Card --> <div class="login-modal" id="loginModal"> <h2>Uni Pilot Portal</h2> <div class="input-group"> <label>Matric Number / Email</label> <input type="text" placeholder="e.g. AAUA/2023/1234"> </div> <div class="input-group"> <label>Password</label> <input type="password" placeholder="••••••••"> </div> <button class="submit-btn">Access Portal</button> </div> </div> <script> // Timing sequence control using JavaScript const welcomeScreen = document.getElementById('welcomeScreen'); const navigatingScreen = document.getElementById('navigatingScreen'); const openLoginBtn = document.getElementById('openLoginBtn'); const loginModal = document.getElementById('loginModal'); // After 3.5 seconds, fade out the welcome screen and fade in "START NAVIGATING" setTimeout(() => { welcomeScreen.classList.add('fade-out'); setTimeout(() => { welcomeScreen.style.display = 'none'; navigatingScreen.classList.add('fade-in'); }, 500); // Wait for fade out transition to complete }, 3500); // When user clicks "LOGIN / SIGNIN", hide the navigating title and show the login form card openLoginBtn.addEventListener('click', () => { navigatingScreen.classList.remove('fade-in'); navigatingScreen.classList.add('fade-out'); setTimeout(() => { navigatingScreen.style.display = 'none'; loginModal.classList.add('fade-in'); }, 400); }); </script>   <script src="site-navigation.js"></script>
</body> </html>
