<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5d3b">
  <title>Uni Pilot AI | Your Academic Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="site-navigation.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("uniPilotTheme") || "light";
        var dark = saved === "dark" || (saved === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themeChoice = ["light", "dark", "system"].includes(saved) ? saved : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <style>
    :root { --ai-green:#0b5d3b; --ai-dark:#063b26; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { position:fixed; inset:0; width:100%; height:100%; font-family:Manrope,sans-serif; background:var(--background,#f7faf8); color:var(--text,#17221c); }
    .ai-page { position:fixed; inset:0; width:min(100%, 920px); height:100vh; height:100dvh; margin:0 auto; padding:0; }
    .chat-card { height:100%; display:flex; flex-direction:column; background:var(--white,#fff); border-left:1px solid var(--border,#dfe8e2); border-right:1px solid var(--border,#dfe8e2); overflow:hidden; }
    .chat-card { padding-top:110px; }
    .chat-head { position:fixed; top:var(--visual-viewport-top, 0px); left:50%; transform:translateX(-50%); width:min(100%,920px); flex:0 0 auto; min-height:72px; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--border,#dfe8e2); background:var(--white,#fff); z-index:20; }
    .ai-notice { position:fixed; top:calc(var(--visual-viewport-top, 0px) + 72px); left:50%; transform:translateX(-50%); width:min(100%,920px); min-height:38px; padding:8px 18px; border-bottom:1px solid var(--border,#dfe8e2); background:var(--white,#fff); color:var(--muted,#6d7a72); font-size:.68rem; line-height:1.45; z-index:19; }
    .assistant-id { display:flex; align-items:center; gap:11px; min-width:0; }
    .assistant-icon { width:44px; height:44px; flex:0 0 44px; display:grid; place-items:center; border-radius:50%; background:#eaf6ef; font-size:23px; }
    .assistant-name { font-weight:800; font-size:.98rem; }
    .assistant-status { color:#16834e; font-size:.72rem; font-weight:700; margin-top:3px; }
    .clear-btn { border:1px solid var(--border,#dfe8e2); background:transparent; color:var(--text,#17221c); border-radius:999px; padding:8px 12px; font:700 .75rem Manrope,sans-serif; cursor:pointer; }
    .messages { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:20px clamp(12px,3vw,25px); display:flex; flex-direction:column; gap:13px; scroll-behavior:smooth; }
    .message { max-width:min(85%,680px); padding:12px 15px; border-radius:17px; font-size:.9rem; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere; }
    .message.assistant { white-space:normal; align-self:flex-start; background:var(--light-green,#eaf6ef); color:var(--text,#17221c); border-bottom-left-radius:5px; }
    .message.assistant p { margin:0 0 10px; }
    .message.assistant p:last-child { margin-bottom:0; }
    .message.assistant h1,.message.assistant h2,.message.assistant h3 { margin:13px 0 7px; line-height:1.3; }
    .message.assistant ul,.message.assistant ol { margin:7px 0 11px; padding-left:23px; }
    .message.assistant li { margin:4px 0; }
    .message.assistant strong { font-weight:800; }
    .message.assistant code { background:rgba(0,0,0,.08); padding:2px 5px; border-radius:5px; font-size:.88em; }
    .message.assistant pre { white-space:pre-wrap; overflow-wrap:anywhere; background:rgba(0,0,0,.08); padding:11px; border-radius:9px; }
    .message.assistant pre code { background:transparent; padding:0; }
    .message.assistant blockquote { margin:8px 0; padding-left:12px; border-left:3px solid var(--ai-green); opacity:.9; }
    .message.user { align-self:flex-end; background:var(--ai-green); color:#fff; border-bottom-right-radius:5px; }
    .message.error { background:#fff0ed; color:#9b3020; }
    .assistant-response { align-self:flex-start; max-width:min(85%,680px); }
    .assistant-response .message { max-width:100%; }
    .assistant-response.animate-answer .message > p,
    .assistant-response.animate-answer .message > h1,
    .assistant-response.animate-answer .message > h2,
    .assistant-response.animate-answer .message > h3,
    .assistant-response.animate-answer .message li,
    .assistant-response.animate-answer .message pre,
    .assistant-response.animate-answer .message blockquote {
      opacity:0;
      animation: answerFadeIn 2.1s ease forwards;
    }
    @keyframes answerFadeIn {
      from { opacity:0; transform:translateY(5px); }
      to { opacity:1; transform:translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .assistant-response.animate-answer .message > p,
      .assistant-response.animate-answer .message > h1,
      .assistant-response.animate-answer .message > h2,
      .assistant-response.animate-answer .message > h3,
      .assistant-response.animate-answer .message li,
      .assistant-response.animate-answer .message pre,
      .assistant-response.animate-answer .message blockquote {
        opacity:1;
        animation:none;
      }
    }
    .fine-print { margin:5px 5px 0; color:var(--muted,#6d7a72); font-size:.65rem; line-height:1.45; }
    .composer-wrap { flex:0 0 auto; padding:11px 14px max(12px, env(safe-area-inset-bottom)); border-top:1px solid var(--border,#dfe8e2); background:var(--white,#fff); }
    .composer { display:flex; gap:9px; align-items:flex-end; padding:7px; border:1px solid var(--border,#dfe8e2); border-radius:22px; background:var(--background,#f7faf8); }
    .composer textarea { flex:1; min-width:0; max-height:125px; min-height:43px; resize:none; border:0; outline:0; background:transparent; color:var(--text,#17221c); padding:11px 9px; font:500 .88rem Manrope,sans-serif; }
    .send-btn { flex:0 0 44px; height:44px; border:0; border-radius:50%; background:var(--ai-green); color:#fff; font-size:19px; cursor:pointer; }
    .send-btn:disabled { opacity:.5; cursor:not-allowed; }
    .typing-bubble { display:flex; align-items:center; gap:5px; min-width:62px; min-height:42px; }
    .typing-bubble span { width:8px; height:8px; border-radius:50%; background:#16834e; animation:typingPulse 1.15s infinite ease-in-out; }
    .typing-bubble span:nth-child(2) { animation-delay:.16s; }
    .typing-bubble span:nth-child(3) { animation-delay:.32s; }
    @keyframes typingPulse { 0%,60%,100% { transform:translateY(0); opacity:.45; } 30% { transform:translateY(-5px); opacity:1; } }
    html[data-theme="dark"] body { background:#070d12; color:#eef4f7; }
    html[data-theme="dark"] .chat-card, html[data-theme="dark"] .chat-head, html[data-theme="dark"] .composer-wrap, html[data-theme="dark"] .ai-notice { background:#0d1720; border-color:#263b49; }
    html[data-theme="dark"] .assistant-icon { background:#10382e; }
    html[data-theme="dark"] .message.assistant { background:#10382e; color:#eef4f7; }
    html[data-theme="dark"] .clear-btn { color:#eef4f7; border-color:#304452; }
    html[data-theme="dark"] .composer { background:#0a141c; border-color:#304452; }
    html[data-theme="dark"] .composer textarea { color:#eef4f7; }
    @media(max-width:600px) {
      .chat-card { border:0; }
      .chat-card { padding-top:104px; }
      .chat-head { min-height:66px; padding:9px 13px; }
      .ai-notice { top:calc(var(--visual-viewport-top, 0px) + 66px); min-height:38px; padding:8px 13px; font-size:.64rem; }
      .assistant-icon { width:41px; height:41px; flex-basis:41px; }
      .messages { padding:14px 11px; gap:11px; }
      .message, .assistant-response { max-width:93%; }
      .message { font-size:.86rem; padding:10px 13px; }
      .composer-wrap { padding:9px 10px max(10px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <main class="ai-page">
    <section class="chat-card">
      <header class="chat-head">
        <div class="assistant-id">
          <div class="assistant-icon" aria-hidden="true">🎓</div>
          <div>
            <div class="assistant-name">Uni Pilot AI</div>
            <div class="assistant-status" id="statusText">● Online</div>
          </div>
        </div>
        <button class="clear-btn" id="clearChat" type="button">New chat ↻</button>
      </header>

      <div class="ai-notice" role="note">AI can make mistakes. Confirm important admission and administrative information with official university sources.</div>

      <div class="messages" id="messages" aria-live="polite">
        <div class="assistant-response">
          <div class="message assistant">
            <p><strong>Hello! 👋</strong></p>
            <p>I'm here to help with your studies, learning and university life. What would you like to understand today?</p>
          </div>
        </div>
      </div>

      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="userInput" rows="1" maxlength="3000" placeholder="Message Uni Pilot AI..." aria-label="Your message" required></textarea>
          <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">➤</button>
        </form>
      </div>
    </section>
  </main>
  <script>
    const API_URL = "https://uni-pilot-ai.keffyjnr0.workers.dev/chat";
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("statusText");
    const history = [];
    const CHAT_STORAGE_KEY = "uniPilotAIChatHistoryV1";
    let chatLog = [];

    function saveChatLog() {
      try {
        localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(chatLog));
      } catch (error) {
        console.warn("Unable to save chat history in this browser.", error);
      }
    }

    function restoreChatLog() {
      try {
        const saved = JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || "[]");
        if (!Array.isArray(saved)) return;
        chatLog = saved.filter(item =>
          item && (item.role === "user" || item.role === "assistant") &&
          typeof item.content === "string"
        ).slice(-200);
      } catch (error) {
        chatLog = [];
      }

      if (!chatLog.length) return;
      messagesEl.innerHTML = "";
      history.length = 0;
      chatLog.forEach(item => {
        addMessage(item.content, item.role, null, true);
        history.push(item);
      });
      requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
      statusText.textContent = "● Previous chat restored";
    }

    function rememberMessage(role, content) {
      chatLog.push({ role, content });
      if (chatLog.length > 200) chatLog = chatLog.slice(-200);
      saveChatLog();
    }

    // Keep the chat header aligned with the visible phone screen when the
    // on-screen keyboard opens and the browser changes its visual viewport.
    function syncVisualViewport() {
      if (!window.visualViewport) return;
      document.documentElement.style.setProperty(
        "--visual-viewport-top",
        Math.max(0, window.visualViewport.offsetTop) + "px"
      );
    }
    if (window.visualViewport) {
      syncVisualViewport();
      window.visualViewport.addEventListener("resize", syncVisualViewport);
      window.visualViewport.addEventListener("scroll", syncVisualViewport);
    }
    window.addEventListener("orientationchange", syncVisualViewport);

    function formatAssistantText(text) {
      const escapeHtml = value => value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      const inline = value => {
        let out = value;
        out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        out = out.replace(/__(.+?)__/g, "<strong>$1</strong>");
        out = out.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<em>$1</em>");
        out = out.replace(/(?<!_)_([^_\n]+)_(?!_)/g, "<em>$1</em>");
        out = out.replace(/\x60([^\x60\n]+)\x60/g, "<code>$1</code>");
        out = out.replace(/\*\*/g, "").replace(/(^|\s)\*(?=\s|$)/g, "$1");
        return out;
      };
      const safe = escapeHtml(String(text || "")).replace(/\r\n?/g, "\n");
      const codeBlocks = [];
      const protectedText = safe.replace(/\x60{3}([\w-]*)\n?([\s\S]*?)\x60{3}/g, (_, lang, code) => {
        return "@@CODE" + (codeBlocks.push("<pre><code>" + code.trimEnd() + "</code></pre>") - 1) + "@@";
      });
      const output = [];
      let listType = null;
      const closeList = () => { if (listType) output.push(listType === "ul" ? "</ul>" : "</ol>"); listType = null; };
      for (const raw of protectedText.split("\n")) {
        const line = raw.trim();
        if (!line) { closeList(); continue; }
        if (/^([-*_])\1\1+\s*$/.test(line)) { closeList(); continue; }
        const heading = line.match(/^#{1,3}\s+(.+)$/);
        if (heading) {
          closeList();
          const level = Math.min(line.match(/^#+/)[0].length, 3);
          output.push("<h" + level + ">" + inline(heading[1]) + "</h" + level + ">");
          continue;
        }
        const bullet = line.match(/^[-*+]\s+(.+)$/);
        const numbered = line.match(/^\d+[.)]\s+(.+)$/);
        if (bullet || numbered) {
          const wanted = bullet ? "ul" : "ol";
          if (listType !== wanted) { closeList(); output.push(wanted === "ul" ? "<ul>" : "<ol>"); listType = wanted; }
          output.push("<li>" + inline(bullet ? bullet[1] : numbered[1]) + "</li>");
          continue;
        }
        closeList();
        const quote = line.match(/^&gt;\s?(.*)$/);
        if (quote) output.push("<blockquote>" + inline(quote[1]) + "</blockquote>");
        else output.push("<p>" + inline(line.replace(/^#{1,6}\s*/, "")) + "</p>");
      }
      closeList();
      return output.join("").replace(/@@CODE(\d+)@@/g, (_, index) => codeBlocks[Number(index)] || "");
    }

    function addMessage(text, role, extraClass, isRestored) {
      if (role === "assistant" && !extraClass) {
        const wrap = document.createElement("div");
        wrap.className = "assistant-response" + (isRestored ? "" : " animate-answer");
        const bubble = document.createElement("div");
        bubble.className = "message assistant";
        bubble.innerHTML = formatAssistantText(text);

        // Fade the answer in from its first paragraph downward.
        const answerParts = bubble.querySelectorAll("p,h1,h2,h3,li,pre,blockquote");
        answerParts.forEach((part, index) => {
          part.style.animationDelay = Math.min(index * 270, 9000) + "ms";
        });

        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);

        // New answers begin at the top; restored answers stay at the bottom.
        if (!isRestored) {
          requestAnimationFrame(() => {
            const answerTop = wrap.getBoundingClientRect().top
              - messagesEl.getBoundingClientRect().top
              + messagesEl.scrollTop;
            messagesEl.scrollTop = Math.max(0, answerTop - 4);
          });
        }
        return wrap;
      }

      const item = document.createElement("div");
      item.className = "message " + role + (extraClass ? " " + extraClass : "");
      item.textContent = text;
      messagesEl.appendChild(item);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return item;
    }

    function addTypingIndicator() {
      const item = document.createElement("div");
      item.className = "message assistant typing-bubble";
      item.setAttribute("aria-label", "Uni Pilot AI is typing");
      item.innerHTML = "<span></span><span></span><span></span>";
      messagesEl.appendChild(item);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return item;
    }

    async function sendMessage(text) {
      const clean = text.trim();
      if (!clean || sendBtn.disabled) return;

      addMessage(clean, "user");
      history.push({ role: "user", content: clean });
      rememberMessage("user", clean);
      input.value = "";
      sendBtn.disabled = true;
      statusText.textContent = "● Typing...";
      const typing = addTypingIndicator();

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history.slice(-10) })
        });

        const data = await response.json();
        typing.remove();

        if (!response.ok || !data.reply) {
          throw new Error(data.error || "The assistant could not respond. Please try again.");
        }

        addMessage(data.reply, "assistant");
        history.push({ role: "assistant", content: data.reply });
        rememberMessage("assistant", data.reply);
        statusText.textContent = "● Ready to help";
      } catch (error) {
        typing.remove();
        addMessage(error.message || "Connection problem. Please try again.", "assistant", "error");
        history.pop();
        statusText.textContent = "● Connection issue";
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    restoreChatLog();

    form.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.getElementById("clearChat").addEventListener("click", () => {
      history.length = 0;
      chatLog = [];
      saveChatLog();
      messagesEl.innerHTML = '<div class="assistant-response"><div class="message assistant"><p><strong>New conversation 👋</strong></p><p>What would you like to understand today?</p></div></div>';
      statusText.textContent = "● Ready to help";
      input.focus();
    });


  </script>
</body>
</html>
